<!DOCTYPE html>
<html>
<head>
    <title>Foodoraa</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial, sans-serif;
            background:#081229;
            color:white;
            overflow-x:hidden;
        }

        /* TOP BUTTONS */

        .top-buttons{

            width:90%;

            margin:auto;

            display:flex;

            justify-content:flex-end;

            gap:15px;

            padding-top:20px;
        }

        .auth-btn{

            padding:12px 24px;

            border:none;

            border-radius:12px;

            background:linear-gradient(to right,#39FF14,#00E5FF);

            color:black;

            font-size:15px;

            font-weight:bold;

            cursor:pointer;

            transition:0.3s;

            box-shadow:
            0 0 15px #39FF14;
        }

        .auth-btn:hover{

            transform:scale(1.05);

            box-shadow:
            0 0 20px #39FF14,
            0 0 40px #00E5FF;
        }

        /* TITLE */

        h1{

            text-align:center;

            margin-top:10px;

            font-size:60px;

            color:#39FF14;

            text-shadow:
            0 0 10px #39FF14,
            0 0 20px #39FF14,
            0 0 40px #39FF14;
        }

        /* MAIN CONTAINER */

        .main-container{

            width:90%;

            margin:50px auto;

            display:flex;

            justify-content:center;

            gap:35px;

            flex-wrap:wrap;
        }

        /* CARD */

        .card{

            width:280px;

            padding:40px 25px;

            border-radius:25px;

            background:rgba(255,255,255,0.08);

            border:1px solid rgba(255,255,255,0.2);

            backdrop-filter:blur(12px);

            text-align:center;

            transition:0.3s;

            box-shadow:
            0 0 15px rgba(57,255,20,0.2);
        }

        .card:hover{

            transform:translateY(-8px);

            box-shadow:
            0 0 20px #39FF14,
            0 0 40px rgba(57,255,20,0.4);
        }

        .card h2{

            color:#39FF14;

            font-size:38px;

            margin-bottom:15px;

            text-shadow:
            0 0 10px #39FF14;
        }

        .card p{

            color:#d1d5db;

            font-size:18px;

            margin-bottom:25px;
        }

        .card a{

            text-decoration:none;
        }

        .card button{

            padding:14px 28px;

            border:none;

            border-radius:12px;

            background:linear-gradient(to right,#39FF14,#00E5FF);

            color:black;

            font-size:16px;

            font-weight:bold;

            cursor:pointer;

            transition:0.3s;

            box-shadow:
            0 0 15px #39FF14;
        }

        .card button:hover{

            transform:scale(1.05);

            box-shadow:
            0 0 20px #39FF14,
            0 0 40px #00E5FF;
        }

        /* FOOTER */

        .footer{

            width:100%;

            position:fixed;

            bottom:0;

            background:#111827;

            display:flex;

            justify-content:space-around;

            padding:18px 0;

            border-top:2px solid #39FF14;

            box-shadow:
            0 0 15px #39FF14;
        }

        .footer a{

            color:#39FF14;

            text-decoration:none;

            font-size:20px;

            font-weight:bold;
        }

        .footer a:hover{

            text-shadow:
            0 0 10px #39FF14;
        }

    </style>

</head>

<body>

    <!-- LOGIN BUTTONS -->
<div class="top-buttons">

    <a href="/login">
        <button class="auth-btn">
            Login
        </button>
    </a>

    <a href="/signin">
        <button class="auth-btn">
            Sign In
        </button>
    </a>

    <a href="/logout">
        <button class="auth-btn logout-btn">
            Logout
        </button>
    </a>

</div>
    <!-- TITLE -->

    <h1>Welcome to Foodoraa</h1>

    <!-- MAIN CARDS -->

    <div class="main-container">

        <!-- VOLUNTEER -->

        <div class="card">

            <h2>Volunteer 🚴</h2>

            <p>
                Deliver food and earn money
            </p>

            <a href="/volunteer">

                <button>
                    Open
                </button>

            </a>

        </div>

        <!-- DONATE -->

        <div class="card">

            <h2>Donate 🍱</h2>

            <p>
                Donate excess food easily
            </p>

            <a href="/donate">

                <button>
                    Open
                </button>

            </a>

        </div>

        <!-- ADMIN -->

        <div class="card">

            <h2>Admin 📊</h2>

            <p>
                Manage the system
            </p>

            <a href="/admin">

                <button>
                    Open
                </button>

            </a>

        </div>

    </div>

    <!-- FOOTER -->

    <div class="footer">

        <a href="/">Home</a>

        <a href="/about">About</a>

        <a href="/savings">Savings</a>

    </div>

</body>
</html>
